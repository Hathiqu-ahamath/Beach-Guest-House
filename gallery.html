<script>
function toggleMobileMenu() {
  const menu = document.getElementById('mobile-menu');
  if (menu.classList.contains('menu-open')) {
    menu.classList.remove('menu-open');
  } else {
    menu.classList.add('menu-open');
  }
}
</script>
<style>
#mobile-menu.menu-open {
  display: flex !important;
  transform: translateX(0);
}
.menu-item {
  opacity: 0;
  transform: translateX(20px);
  animation: slideIn 0.4s ease forwards;
}
#mobile-menu.menu-open .menu-item:nth-child(1) { animation-delay: 0.1s; }
#mobile-menu.menu-open .menu-item:nth-child(2) { animation-delay: 0.2s; }
#mobile-menu.menu-open .menu-item:nth-child(3) { animation-delay: 0.3s; }
#mobile-menu.menu-open .menu-item:nth-child(4) { animation-delay: 0.4s; }
#mobile-menu.menu-open .menu-item:nth-child(5) { animation-delay: 0.5s; }

@keyframes slideIn {
  to {
    opacity: 1;
    transform: translateX(0);
  }
}
@keyframes pulse-whatsapp {
  0%, 100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4); }
  50% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
}
@keyframes float-whatsapp {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.whatsapp-btn {
  animation: pulse-whatsapp 2s infinite, float-whatsapp 3s ease-in-out infinite;
}

</div>
<script>
function openLightbox(img) {
  document.getElementById('lightbox-img').src = img.src;
  document.getElementById('lightbox').style.display = 'flex';
}
function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
}
</script>
